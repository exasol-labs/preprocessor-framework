# CI workflow skeleton for preprocessor-framework
#
# Five jobs:
#   lint           — Python ruff + Lua luacheck (always runs, no database)
#   unit           — pytest -m "not integration" (always green; no database)
#   test           — full pytest against a pinned exasol/docker-db (mandatory)
#   release        — build release.sql and upload it as a per-run artifact
#   github-release — on a v* tag, publish a GitHub Release with release.sql
#
# The docker-db image (exasol/docker-db:latest) can take several minutes to
# start, which is why the job polls for readiness rather than sleeping.
# Both the unit job and the integration job are mandatory gates.

name: CI

on:
  push:
  pull_request:

jobs:

  # ---------------------------------------------------------------------------
  # lint: Python (ruff) + Lua (luacheck)
  # ---------------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install Python dependencies
        run: uv sync

      # Python linting — commands must match plan.md Verification checklist
      - name: ruff check
        run: uv run ruff check .

      - name: ruff format check
        run: uv run ruff format --check .

      # Lua toolchain — standard leafo pattern
      - name: Set up Lua 5.1
        uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.1"

      - name: Set up LuaRocks
        uses: leafo/gh-actions-luarocks@v4

      - name: Install luacheck
        run: luarocks install luacheck

      # Lua linting — command must match plan.md Verification checklist
      - name: luacheck
        run: luacheck sql/lua/ --config .luacheckrc

  # ---------------------------------------------------------------------------
  # unit: pytest without integration marker (no database needed, always green)
  # ---------------------------------------------------------------------------
  unit:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install Python dependencies
        run: uv sync

      # Lua 5.1 — without an interpreter on PATH,
      # test_lua_splitter_matches_corpus_under_a_local_interpreter (the fallback
      # that proves the Python and Lua splitters agree with no Exasol instance in
      # the loop) has no interpreter to find and skips; tests/_lua_splitter.py's
      # lua_interpreter() discovers it via PREPROC_TEST_LUA or PATH with no
      # further configuration needed.
      - name: Set up Lua 5.1
        uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.1"

      - name: Run unit tests
        run: uv run pytest -m "not integration" -v

  # ---------------------------------------------------------------------------
  # test: full integration suite against exasol/docker-db
  #
  # A mandatory gate: once disk is reclaimed the DB boots reliably (~70s to
  # ready) and the suite runs in ~7-8 min, so a failure here now blocks the run
  # rather than being informational.
  # ---------------------------------------------------------------------------
  test:
    name: Integration tests (docker-db)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Reclaim disk BEFORE anything is installed. On ubuntu-latest the
      # preinstalled toolchains (.NET, Android SDK, GHC, …) leave too little room
      # for the DB's EXAStorage volume — without this the engine fails at stage3
      # with "Failed to create volume: insufficient space" and never becomes
      # ready. This MUST run before "Set up uv": tool-cache:true wipes
      # /opt/hostedtoolcache, so freeing after uv is installed would delete uv.
      - name: Free up disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          large-packages: true

      - name: Show available disk space
        run: df -h /

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install Python dependencies
        run: uv sync

      # Start the Exasol database container.
      # --privileged is required by docker-db (uses cgroups internally).
      # Port 8563 is the default Exasol client port.
      #
      # The image tag tracks the floating `latest` tag so the integration suite
      # always runs against the newest docker-db release rather than a stale
      # pinned version.
      #
      # --shm-size=4g (raised from 2g): headroom for the per-UDF Python VMs,
      # which talk to the engine over shared memory. Kept deliberately, but note
      # it fixed nothing on its own — the five bucketfs error-path tests that
      # failed here with "VM error: Internal error: VM crashed" were NOT
      # memory-starved, and neither raising this nor pinning the image changed
      # the outcome. The cause is that this image tears the UDF VM down where a
      # real cluster lets the resolver emit its structured ERROR row; the tests
      # tolerate both shapes, as tests/test_db_resolver.py::
      # test_resolver_https_no_egress_network_error documented first.
      # Deliberately NOT `-m/--memory`: the container is otherwise uncapped
      # here, so a limit would reduce headroom rather than add it.
      - name: Start Exasol docker-db
        run: |
          docker run -d \
            --name exasol \
            --privileged \
            --shm-size=4g \
            -p 8563:8563 \
            exasol/docker-db:latest

      # Poll until the database is ready to accept connections.
      # docker-db can take 5-10 minutes on a cold runner; use a generous timeout.
      - name: Wait for Exasol to be ready
        env:
          EXASOL_DSN: "localhost:8563"
          EXASOL_USER: sys
          EXASOL_PASSWORD: exasol
        run: |
          uv run python - <<'EOF'
          import time, sys
          import pyexasol

          dsn      = "localhost:8563"
          user     = "sys"
          password = "exasol"
          timeout  = 600   # seconds — docker-db is slow on a cold runner
          interval = 10    # seconds between polls
          deadline = time.time() + timeout

          print("Waiting for Exasol to accept connections …", flush=True)
          while time.time() < deadline:
              try:
                  conn = pyexasol.connect(
                      dsn=dsn, user=user, password=password,
                      websocket_sslopt={"cert_reqs": 0},
                  )
                  conn.close()
                  print("Exasol is ready.", flush=True)
                  sys.exit(0)
              except Exception as exc:
                  print(f"  not ready yet ({exc}); retrying in {interval}s …", flush=True)
                  time.sleep(interval)

          print("ERROR: Exasol did not become ready within the timeout.", file=sys.stderr)
          sys.exit(1)
          EOF

      # Run the full pytest suite (integration + unit).
      - name: Run pytest
        env:
          EXASOL_DSN: "localhost:8563"
          EXASOL_USER: sys
          EXASOL_PASSWORD: exasol
          # Disable TLS verification — docker-db uses a self-signed certificate.
          EXASOL_TLS_VERIFY: "0"
        run: uv run pytest -v

      # If anything above failed (DB never became ready, or pytest errored), dump
      # the container's own logs and status. Without this, CI only shows the
      # client-side "not ready yet" retries and the actual boot failure inside the
      # container is invisible. Runs on failure only; never masks a green run.
      - name: Dump Exasol container logs on failure
        if: failure()
        run: |
          echo "===== docker ps -a ====="
          docker ps -a || true
          echo "===== docker logs exasol ====="
          docker logs exasol || true

  # release: build the single-file framework deploy and publish it as an
  # artifact. release.sql is NOT committed to the repo — it is generated from the
  # sql/ sources on every push so it can never drift from the framework code.
  release:
    name: Build release.sql
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install Python dependencies
        run: uv sync

      - name: Generate release.sql
        run: uv run preproc bundle --release --output release.sql

      - name: Upload release.sql artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-sql
          path: release.sql
          if-no-files-found: error

  # github-release: on a version tag (e.g. v1.2.0), publish a GitHub Release
  # with the generated release.sql attached as a downloadable asset. Gated on all
  # three mandatory checks — lint, unit, and the docker-db integration suite — so
  # a tag never publishes a build that fails any of them. Tag and push to trigger:
  #   git tag v1.2.0 && git push origin v1.2.0
  github-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, unit, test]
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install Python dependencies
        run: uv sync

      - name: Generate release.sql
        run: uv run preproc bundle --release --output release.sql

      # Idempotent: if the release already exists (e.g. it was created from the
      # GitHub UI, which also creates the tag that triggers this workflow), just
      # attach/replace release.sql instead of failing on a duplicate create.
      - name: Publish GitHub Release with release.sql attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists — uploading release.sql."
            gh release upload "${GITHUB_REF_NAME}" release.sql --clobber
          else
            gh release create "${GITHUB_REF_NAME}" release.sql \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes
          fi
