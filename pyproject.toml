[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "preprocessor-framework"
version = "0.6.0"
description = "Config-driven Exasol SQL preprocessor dispatch framework"
requires-python = ">=3.12"
dependencies = [
    "pyexasol>=0.25.0",
]

[project.scripts]
preproc = "preproc.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/preproc"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a live Exasol instance"]
